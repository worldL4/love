<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的时光 ❤</title>
<style>
  :root {
    --bg: #1a1225;
    --bg2: #241636;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
    --text: #f5eef8;
    --sub: #b8a6c9;
    --accent: #ff6b9d;
    --accent2: #c084fc;
    --gold: #ffd166;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    overflow-x: hidden;
    line-height: 1.6;
  }
  /* 星空背景 */
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .main { position:relative; z-index:1; }

  nav {
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    padding:12px; background:rgba(26,18,37,0.75); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  nav a {
    color:var(--sub); text-decoration:none; font-size:14px; padding:6px 14px;
    border-radius:99px; transition:all .3s;
  }
  nav a:hover { color:var(--accent); background:rgba(255,107,157,0.1); }

  section { max-width:1080px; margin:0 auto; padding:90px 24px 40px; }
  h2 {
    font-size:30px; text-align:center; margin-bottom:10px; font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sec-sub { text-align:center; color:var(--sub); font-size:14px; margin-bottom:36px; }

  /* Hero */
  .hero { min-height:92vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding-top:60px; }
  .hero-heart { font-size:64px; animation:beat 1.4s ease-in-out infinite; filter:drop-shadow(0 0 24px rgba(255,107,157,.5)); }
  @keyframes beat { 0%,100%{transform:scale(1)} 12%{transform:scale(1.18)} 24%{transform:scale(1)} 36%{transform:scale(1.12)} 48%{transform:scale(1)} }
  .hero-names { font-size:46px; font-weight:800; margin:14px 0 6px; letter-spacing:2px; }
  .hero-names .amp { color:var(--accent); font-size:34px; margin:0 12px; }
  .hero-since { color:var(--sub); font-size:15px; margin-bottom:44px; }
  .counter { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .counter .cell {
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px 10px; min-width:96px; backdrop-filter:blur(6px);
  }
  .counter .num { font-size:34px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .counter .lab { font-size:12px; color:var(--sub); margin-top:2px; }
  .next-anniv { margin-top:26px; color:var(--sub); font-size:14px; }
  .next-anniv b { color:var(--gold); }

  /* 照片图集（按约会分区） */
  .album-group { margin-bottom:40px; }
  .album-title {
    display:flex; align-items:center; gap:10px;
    font-size:18px; font-weight:700; margin-bottom:16px; color:var(--text);
  }
  .album-title::before {
    content:"♥"; color:var(--accent); font-size:16px;
  }
  .album-title .count { font-size:12px; color:var(--sub); font-weight:400; }
  .gallery {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
  }
  .ph {
    position:relative; border-radius:12px; overflow:hidden; cursor:pointer;
    aspect-ratio:1/1; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    transition:transform .25s, box-shadow .25s;
  }
  .ph:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(192,132,252,.28); }
  .ph img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .ph .cap {
    position:absolute; left:0; right:0; bottom:0; padding:16px 8px 8px; font-size:11px;
    background:linear-gradient(transparent,rgba(0,0,0,.7)); color:#fff; text-align:center;
  }
  .ph.placeholder .heart { font-size:26px; opacity:.85; }
  .ph.placeholder .txt { font-size:11px; color:var(--sub); text-align:center; padding:0 8px; }
  .ph.p1 { background:linear-gradient(135deg,#5b2a86,#a34a9e); }
  .ph.p2 { background:linear-gradient(135deg,#83314a,#d16ba5); }
  .ph.p3 { background:linear-gradient(135deg,#3d2b6b,#7a5cc0); }
  .ph.p4 { background:linear-gradient(135deg,#6b2e4e,#e06c9f); }
  .ph.p5 { background:linear-gradient(135deg,#2f3a6b,#5f7cc0); }
  .ph.p6 { background:linear-gradient(135deg,#5a3a2e,#c98a5e); }

  /* 灯箱 */
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #lightbox img { max-width:92vw; max-height:88vh; border-radius:12px; }

  /* 时间线 */
  .timeline { position:relative; max-width:720px; margin:0 auto; padding-left:32px; }
  .timeline::before { content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--accent),var(--accent2)); }
  .tl-item { position:relative; margin-bottom:34px; }
  .tl-item::before {
    content:"♥"; position:absolute; left:-34px; top:2px; color:var(--accent); font-size:16px;
    background:var(--bg); padding:2px 0;
  }
  .tl-item .date { color:var(--gold); font-size:13px; letter-spacing:1px; }
  .tl-item .title { font-size:19px; font-weight:700; margin:4px 0; }
  .tl-item .desc { color:var(--sub); font-size:14.5px; }

  footer { text-align:center; color:var(--sub); font-size:13px; padding:50px 20px 40px; }
  footer .heartline { letter-spacing:8px; color:var(--accent); margin-bottom:10px; font-size:16px; }

  .fade-in { opacity:0; transform:translateY(26px); transition:all .8s ease; }
  .fade-in.show { opacity:1; transform:none; }

  @media (max-width:560px){
    .hero-names { font-size:32px; }
    .counter .cell { min-width:72px; padding:12px 6px; }
    .counter .num { font-size:24px; }
    section { padding:80px 18px 30px; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="main">

<nav>
  <a href="#home">首页</a>
  <a href="#gallery">图集</a>
  <a href="#timeline">回忆录</a>
</nav>

<!-- 首页 -->
<section class="hero" id="home">
  <div class="hero-heart">❤</div>
  <div class="hero-names"><span id="nameA">我</span><span class="amp">&amp;</span><span id="nameB">宝贝</span></div>
  <div class="hero-since" id="sinceText">自 2024 年 1 月 1 日起，我们在一起</div>
  <div class="counter">
    <div class="cell"><div class="num" id="cDay">0</div><div class="lab">天</div></div>
    <div class="cell"><div class="num" id="cHour">0</div><div class="lab">小时</div></div>
    <div class="cell"><div class="num" id="cMin">0</div><div class="lab">分钟</div></div>
    <div class="cell"><div class="num" id="cSec">0</div><div class="lab">秒</div></div>
  </div>
  <div class="next-anniv" id="nextAnniv"></div>
</section>

<!-- 照片图集 -->
<section id="gallery">
  <h2 class="fade-in">📷 我们的图集</h2>
  <div class="sec-sub fade-in">按约会分区 · 点击照片可以放大</div>
  <div class="fade-in" id="galleryWrap"></div>
</section>

<!-- 时间线 -->
<section id="timeline">
  <h2 class="fade-in">📜 回忆时间线</h2>
  <div class="sec-sub fade-in">从相遇到现在的每一步，都值得被记住</div>
  <div class="timeline fade-in" id="timelineBox"></div>
</section>

<footer>
  <div class="heartline">♥ ♥ ♥</div>
  <div id="footerText">这个网页，只为你而写。</div>
</footer>

</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src="" alt=""></div>

<script>
/* =========================================================
 * ✏️ 数据配置区 —— 所有内容都在这里改，方便随时补充
 * ========================================================= */
const CONFIG = {
  // 两个人的昵称
  nameA: "刘宏洋",
  nameB: "骆林洁",

  // 在一起的日期（用于倒计时，格式：年,月-1,日）
  startDate: new Date(2026, 9, 28),

  // 照片图集：按约会分区。每个区是一个对象：title=分区名，photos=该区的照片数组
  // 每张照片：img=图片路径（把照片放进同目录并改名），cap=配文
  // 下面先用占位卡片，发我真实照片后即可替换
  albums: [
    {
      title: "第一次约会 · 2026.11.07",
      photos: [
        { img: "photos/date1/ktv.jpg", cap: "晚上去的 KTV" },
        { img: "photos/date1/hotpot1.jpg", cap: "荡古里小火锅" },
        { img: "photos/date1/send-home.jpg", cap: "送我回学校" },
        { img: "photos/date1/heying.jpg", cap: "我们的合照" },
        { img: "photos/date1/hotpot2.jpg", cap: "荡古里小火锅" },
      ],
    },
    {
      title: "第二次约会 · 2026.11.14",
      photos: [
        { img: null, cap: "电影《我们仅有一次的人生》" },
        { img: null, cap: "揽月湾看海" },
        { img: null, cap: "部队火锅" },
      ],
    },
  ],

  // 回忆时间线：date / title / desc
  timeline: [
    { date: "2026.10.28", title: "我们在一起啦", desc: "故事开始的那一天。" },
    { date: "2026.11.07", title: "第一次约会（立冬）", desc: "看电影、吃小火锅、拼豆、晚上去 KTV。那天下雨，你借我充电宝和雨伞。" },
    { date: "2026.11.14", title: "第二次约会", desc: "逛校园被保安拦下，改看电影、吃鸡公煲，下午私人影院，去揽月湾看海，晚上部队火锅。" },
    { date: "——", title: "下一个纪念日", desc: "正在发生，等待被记录……" },
  ],
};

/* =========================================================
 * 以下为渲染逻辑，一般不用改
 * ========================================================= */

// 首页
document.getElementById("nameA").textContent = CONFIG.nameA;
document.getElementById("nameB").textContent = CONFIG.nameB;
const s = CONFIG.startDate;
document.getElementById("sinceText").textContent =
  `自 ${s.getFullYear()} 年 ${s.getMonth()+1} 月 ${s.getDate()} 日起，我们在一起`;

function tick(){
  const now = new Date();
  let diff = Math.max(0, now - s);
  const day = Math.floor(diff/864e5);
  const hour = Math.floor(diff/36e5)%24;
  const min = Math.floor(diff/6e4)%60;
  const sec = Math.floor(diff/1e3)%60;
  cDay.textContent = day; cHour.textContent = hour; cMin.textContent = min; cSec.textContent = sec;

  // 下一个纪念日（按周年）
  const anni = new Date(s.getFullYear() + now.getFullYear() - s.getFullYear(), s.getMonth(), s.getDate());
  if (anni < now) anni.setFullYear(anni.getFullYear()+1);
  const left = Math.ceil((anni - now)/864e5);
  document.getElementById("nextAnniv").innerHTML =
    `距离下一个纪念日（<b>${anni.getFullYear()} 年 ${anni.getMonth()+1} 月 ${anni.getDate()} 日</b>）还有 <b>${left}</b> 天`;
}
tick(); setInterval(tick, 1000);

// 照片图集（按约会分区）
const PLACEHOLDER_CLASSES = ["p1","p2","p3","p4","p5","p6"];
const wrap = document.getElementById("galleryWrap");
CONFIG.albums.forEach((album, ai) => {
  const group = document.createElement("div");
  group.className = "album-group";
  const title = document.createElement("div");
  title.className = "album-title";
  title.innerHTML = `${album.title} <span class="count">${album.photos.length} 张</span>`;
  group.appendChild(title);
  const grid = document.createElement("div");
  grid.className = "gallery";
  album.photos.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "ph " + (p.img ? "" : "placeholder " + PLACEHOLDER_CLASSES[(ai + i) % 6]);
    if (p.img) {
      el.innerHTML = `<img src="${p.img}" alt="${p.cap}"><div class="cap">${p.cap}</div>`;
      el.onclick = () => { lightboxImg.src = p.img; lightbox.style.display = "flex"; };
    } else {
      el.innerHTML = `<div class="heart">🖼️</div><div class="txt">${p.cap}</div>`;
    }
    grid.appendChild(el);
  });
  group.appendChild(grid);
  wrap.appendChild(group);
});

// 时间线
const tl = document.getElementById("timelineBox");
CONFIG.timeline.forEach(t => {
  const el = document.createElement("div");
  el.className = "tl-item";
  el.innerHTML = `<div class="date">${t.date}</div><div class="title">${t.title}</div><div class="desc">${t.desc}</div>`;
  tl.appendChild(el);
});

// 页脚
document.getElementById("footerText").textContent =
  `这个网页，只为你而写。♥ ${CONFIG.nameA} & ${CONFIG.nameB}`;

// 星空背景
const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
let stars = [];
function resize(){
  cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({length:120}, () => ({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    r: Math.random()*1.4 + .3, a: Math.random(),
    v: Math.random()*.02 + .005
  }));
}
resize(); addEventListener("resize", resize);
(function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(st => {
    st.a += st.v; const al = .35 + Math.abs(Math.sin(st.a))*.6;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7);
    ctx.fillStyle = `rgba(255,255,255,${al})`; ctx.fill();
  });
  requestAnimationFrame(draw);
})();

// 滚动淡入
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add("show");
}), { threshold:.12 });
document.querySelectorAll(".fade-in").forEach(el => io.observe(el));
</script>
</body>
</html>
